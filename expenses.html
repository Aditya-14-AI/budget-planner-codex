<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker - Expenses</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" aria-label="Sidebar navigation">
        <div class="brand">💸 Expense Tracker</div>
        <nav class="nav-links">
          <a href="index.html">Dashboard</a>
          <a href="expenses.html" class="active">Expenses</a>
          <a href="analytics.html">Analytics</a>
        </nav>
        <div class="toggle-row">
          <button id="themeToggle" class="ghost">Toggle dark mode</button>
        </div>
        <div class="actions-column">
          <button id="csvExport" class="primary">Download CSV</button>
        </div>
      </aside>

      <main class="main">
        <header class="toolbar">
          <div>
            <h1 class="page-title">Expense Management</h1>
            <p class="subtitle">Add, sort, and remove transactions quickly.</p>
          </div>
          <div>
            <span class="badge" id="expenseTotalPill">Total: $0</span>
            <button id="openModal" class="primary" style="margin-left: 0.6rem">+ Add Expense</button>
          </div>
        </header>

        <section class="card">
          <h2 class="panel-title">All Transactions</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th><button data-sort="date">Date</button></th>
                  <th><button data-sort="amount">Amount</button></th>
                  <th><button data-sort="category">Category</button></th>
                  <th><button data-sort="description">Description</button></th>
                  <th><button data-sort="paymentMethod">Payment</button></th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="expenseRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="expenseModal" class="modal-backdrop" aria-hidden="true" role="dialog" aria-labelledby="expenseModalTitle">
      <div class="modal">
        <div class="modal-header">
          <h2 id="expenseModalTitle" class="panel-title" style="margin: 0">Add Expense</h2>
          <button id="closeModal" class="ghost" aria-label="Close modal">Close</button>
        </div>

        <form id="expenseForm" class="input-grid" style="margin-top: 0.8rem">
          <div class="field">
            <label for="amount">Amount</label>
            <input id="amount" name="amount" type="number" min="0" step="0.01" required />
          </div>

          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="rent">Rent</option>
              <option value="entertainment">Entertainment</option>
              <option value="utilities">Utilities</option>
              <option value="shopping">Shopping</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="field full">
            <label for="description">Description</label>
            <input id="description" name="description" type="text" maxlength="80" required />
          </div>

          <div class="field">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required />
          </div>

          <div class="field">
            <label for="paymentMethod">Payment Method</label>
            <input id="paymentMethod" name="paymentMethod" type="text" placeholder="Cash, Card, UPI..." required />
          </div>

          <div class="field full">
            <button type="submit" class="primary">Save Expense</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="assets/js/expenses.js"></script>
  </body>
</html>
