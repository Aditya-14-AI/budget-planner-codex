<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker - Dashboard</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" aria-label="Sidebar navigation">
        <div class="brand">💸 Expense Tracker</div>
        <nav class="nav-links">
          <a href="index.html" class="active">Dashboard</a>
          <a href="expenses.html">Expenses</a>
          <a href="analytics.html">Analytics</a>
        </nav>
        <div class="toggle-row">
          <button id="themeToggle" class="ghost" aria-label="Toggle dark mode">Toggle dark mode</button>
        </div>
        <div class="actions-column">
          <button id="csvExport" class="primary">Download CSV</button>
        </div>
      </aside>

      <main class="main">
        <header>
          <h1 class="page-title">Dashboard</h1>
          <p class="subtitle">Track monthly spending and keep your budget under control.</p>
        </header>

        <section class="card-grid" aria-label="Summary cards">
          <article class="card"><h3>Total Monthly Spending</h3><div id="totalSpending" class="card-value">$0</div></article>
          <article class="card"><h3>Monthly Budget</h3><div id="budgetValue" class="card-value">$0</div></article>
          <article class="card"><h3>Budget Remaining</h3><div id="budgetRemaining" class="card-value">$0</div></article>
          <article class="card"><h3>Transactions</h3><div id="transactionCount" class="card-value">0</div></article>
        </section>

        <section class="card">
          <h2 class="panel-title">Set Monthly Budget</h2>
          <div class="toolbar">
            <div class="field" style="min-width: 260px">
              <label for="budgetInput">Budget amount</label>
              <input id="budgetInput" type="number" min="0" step="0.01" placeholder="e.g. 3000" />
            </div>
            <div>
              <button id="saveBudgetBtn" class="primary" style="margin-top: 1.6rem">Save Budget</button>
            </div>
          </div>
        </section>

        <section class="card">
          <h2 class="panel-title">Recent Transactions</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Category</th>
                  <th>Description</th>
                  <th>Payment</th>
                  <th>Amount</th>
                </tr>
              </thead>
              <tbody id="recentRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="assets/js/dashboard.js"></script>
  </body>
</html>
